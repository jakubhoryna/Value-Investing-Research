# gsc-notify: the daily maintenance run and the standing 'GSC - needs Jakub'
# record issue (MODEL v4.8.0 §8.7 items 10 and 12). The rules live in
# gsc_notify.py. The name is kept from v4.5.0, but since v4.8.0 the workflow
# notifies no one: the morning digest is retired, and routine outcomes reach
# Jakub in the WEEKLY routine's report (§8.7 item 11).
#
# - Maintenance once per Prague day, late-tolerant: GitHub starts scheduled
#   runs late and drops some (from 2026-10-08 it started one run per cron
#   line per day, 4-8 h late, so the v4.5.0 06:30-08:30 window never acted).
#   Five cron lines, one tick each: 06:30 Prague in CEST (04:30 UTC) and in
#   CET (05:30 UTC), then spares at 08:30, 11:30 and 14:30 UTC that still
#   land in the window when started hours late. The script acts on the first
#   tick that starts between 06:30 and 21:00 Prague while gsc-automerge has
#   not been dispatched since 06:30 Prague today; every other tick exits
#   (DST-safe; no schedule timezone key, V5). Never in the 02:00-06:00 quiet window:
#   each merge wakes the routine session watching that PR. Re-runs guard runs
#   that a GitHub incident cancelled (attempt 1 only, at most 20, never a
#   'failure'), records a PR whose guard never ran or is stuck, creates the
#   needs-Jakub issue once if missing (unassigned), then dispatches
#   gsc-automerge.
# - Uses only the per-run GITHUB_TOKEN (env GH_TOKEN); no secret exists.
#   Writes only the needs-Jakub issue (created once) and its record comments
#   (no @mention, no '#n'), guard re-runs and the gsc-automerge dispatch;
#   never touches a pull request.
# - A manual dispatch runs only from main and skips the window and the dedupe.
#
# Day-1 checks: V8 a scheduled tick that GitHub starts after 08:30 Prague
# still dispatches gsc-automerge exactly once that day; V9 with Jakub
# unsubscribed from 'GSC - needs Jakub', a record comment sends him no
# notification (a subscriber, or a watcher on 'All Activity', is still
# notified of every comment).
#
# Tests: python3 .github/workflows/test_gsc_notify.py and test_gsc_workflows.py.
name: gsc-notify

on:
  schedule:
    - cron: '30 4 * * *'    # 06:30 Prague in CEST (05:30 CET: before the window, a no-op)
    - cron: '30 5 * * *'    # 06:30 Prague in CET (07:30 CEST: a spare)
    - cron: '30 8 * * *'    # spare: 10:30 CEST / 09:30 CET
    - cron: '30 11 * * *'   # spare: 13:30 CEST / 12:30 CET
    - cron: '30 14 * * *'   # spare: 16:30 CEST / 15:30 CET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsc-notify
  cancel-in-progress: false

jobs:
  maintenance:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
      actions: write          # re-run cancelled guard runs; dispatch gsc-automerge
      issues: write           # the needs-Jakub record issue
    steps:
      - name: Check out the default branch (trusted scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          GSC_AUTOMERGE: ${{ vars.GSC_AUTOMERGE }}
          REPO: ${{ github.repository }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 .github/workflows/gsc_notify.py
